<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Options Page :: Mute Tab</title>
  <link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
  <p>Comma-separated list of hostnames used to automatically unmute tabs with matching addresses. You can enter full or partial hostnames — if a match is detected, the tab will be unmuted automatically. This feature requires the "*://*/*" permission to access tab URLs.</p>
  <textarea rows="5" id="unmute-list" placeholder="e.g.: example.com, google.com"></textarea>

  <p>
    <input type="button" id="faqs" value="Open FAQS Page">
    <input type="button" id="save" value="Save Options">
    <span id="toast"></span>
  </p>
  <script src="index.js"></script>
</body>
</html>
